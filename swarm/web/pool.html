<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pied Piper · PIPER/USDC pool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    body { background: var(--canvas); font-size: 13.5px; }
    main { padding: 24px 16px; display: grid; gap: 16px; max-width: 1100px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; overflow-x: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    header a { font-weight: 600; text-decoration: none; }
    .muted { color: var(--muted); }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
    .hero .price { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .hero .chg { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ranges { display: flex; gap: 6px; margin-left: auto; }
    .ranges button { font: 600 12px var(--sans); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
    .ranges button.on { background: var(--purple-soft); color: var(--purple-ink); border-color: var(--purple-line); }
    .chart { position: relative; margin-top: 12px; }
    .chart svg { display: block; width: 100%; height: 260px; }
    .chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 5px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -120%); display: none; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .tile { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .tile b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; display: block; font-variant-numeric: tabular-nums; }
    .tile > span { font-size: 13px; font-weight: 600; }
    .tile .muted { font-size: 11.5px; margin-top: 2px; }
    .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 14px 0 4px; }
    .bar i:first-child { background: var(--purple); }
    .bar i:last-child { background: var(--green); }
    .calc { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .calc select, .calc input { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); color: var(--ink); }
    .calc input { width: 9em; text-align: right; }
    .out { margin-top: 12px; display: grid; gap: 6px; }
    .out .big { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .out .row { display: flex; justify-content: space-between; max-width: 460px; border-bottom: 1px solid var(--line); padding: 4px 0; font-variant-numeric: tabular-nums; }
    .warn { color: var(--amber); }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 11.5px; font-weight: 500; color: var(--soft); background: var(--page); }
    th:first-child, td:first-child, th.l, td.l { text-align: left; }
    .tag { font-weight: 700; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
    .tag.buy { background: var(--green-soft); color: var(--green); }
    .tag.sell { background: var(--red-soft); color: var(--red); }
    .tag.deposit, .tag.withdraw, .tag.open { background: var(--purple-soft); color: var(--purple-ink); }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .mono { font-family: var(--mono); font-size: 12px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>PIPER / USDC pool</h1>
    <span class="muted"><span id="conn"></span> · <a href="index.html">Phone</a> · <a href="dashboard.html">Dashboard</a> · <a href="manage.html">Management</a> · <a href="arkiv.html">Arkiv</a></span>
  </header>

  <section class="card">
    <div class="hero">
      <span class="price" id="price">–</span><span class="muted">USDC per PIPER</span>
      <span class="chg" id="change"></span>
      <div class="ranges" id="ranges">
        <button data-r="3600000">1 h</button><button data-r="86400000">24 h</button><button data-r="0" class="on">All</button>
      </div>
    </div>
    <div class="muted" id="inverse"></div>
    <div class="chart"><svg id="chart"></svg><div class="tip" id="tip"></div></div>
  </section>

  <section class="card">
    <h2>What would I get?</h2>
    <form class="calc" id="calc">
      <select id="side"><option value="buy">Buy PIPER, paying</option><option value="sell">Sell PIPER, selling</option></select>
      <input id="amount" value="1" inputmode="decimal"><span id="unit">USDC</span>
    </form>
    <div class="out" id="out"></div>
  </section>

  <section class="card">
    <h2>The pool</h2>
    <div class="tiles" id="tiles"><div class="muted">Reading the chain…</div></div>
    <div class="bar" id="bar"></div>
    <div class="muted" id="barNote"></div>
    <div class="note" id="feesNote"></div>
  </section>

  <section class="card">
    <h2>Activity</h2>
    <table id="activity"></table>
    <div class="note">Read from the Uniswap v4 PoolManager's events on Sepolia. Swap amounts are before the hook's 0.2% cut of the output.</div>
  </section>
</main>
<script type="module" src="pool.js"></script>
</body>
</html>
