<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Swarm · Arkiv database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    body { background: var(--canvas); }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
    .muted { color: var(--muted); }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .head a { font-weight: 600; text-decoration: none; }
    button.quiet { font: 600 12.5px var(--sans); background: none; color: var(--purple-ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="head">
      <h1>Open database on Arkiv</h1>
      <span class="muted" style="font-size:13px"><a href="index.html">Phone</a> · <a href="dashboard.html">Dashboard</a> · <a href="manage.html">Management</a></span>
    </div>
    <div class="muted">Every finished answer saves its conversation and metrics to Arkiv's Rabdi testnet. Anyone can read these entities; only the tracker's wallet can change them.</div>
  </section>
  <section class="card" id="panel"></section>
</main>
<script type="module">
  import { mountArkivPanel } from "./arkiv.js";
  mountArkivPanel(document.getElementById("panel"));
</script>
</body>
</html>
