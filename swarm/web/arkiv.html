<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Swarm · Arkiv database</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #16212b; --muted: #5d6b78; --line: #dde2e7;
      --b1: #d6eef0; --b1s: #0b7a85; --b2: #e3e0f7; --b2s: #5847c2; --b3: #f5e1d3; --b3s: #b4541a;
      --accent: #0b7a85; --bad: #c2352e;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161b; --card: #1a2128; --text: #e6ebf0; --muted: #94a2af; --line: #2c3640;
        --b1: #15393d; --b1s: #4fc3cd; --b2: #2a2550; --b2s: #9d90f0; --b3: #452a1a; --b3s: #f0995e;
        --accent: #4fc3cd; --bad: #ff7b72;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    button.quiet { font: inherit; background: none; color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="head">
      <h1>Open database on Arkiv</h1>
      <span class="muted" style="font-size:13px"><a href="index.html">Phone</a> · <a href="dashboard.html">Dashboard</a> · <a href="manage.html">Management</a></span>
    </div>
    <div class="muted">Every finished answer saves its conversation and metrics to Arkiv's Rabdi testnet. Anyone can read these entities; only the tracker's wallet can change them.</div>
  </section>
  <section class="card" id="panel"></section>
</main>
<script type="module">
  import { mountArkivPanel } from "./arkiv.js";
  mountArkivPanel(document.getElementById("panel"));
</script>
</body>
</html>
