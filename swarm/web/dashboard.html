<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Swarm · Dashboard</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #16212b; --muted: #5d6b78; --line: #dde2e7;
      --b1: #d6eef0; --b1s: #0b7a85; --b2: #e3e0f7; --b2s: #5847c2; --b3: #f5e1d3; --b3s: #b4541a;
      --accent: #0b7a85; --bad: #c2352e; --warn: #b07d00;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161b; --card: #1a2128; --text: #e6ebf0; --muted: #94a2af; --line: #2c3640;
        --b1: #15393d; --b1s: #4fc3cd; --b2: #2a2550; --b2s: #9d90f0; --b3: #452a1a; --b3s: #f0995e;
        --accent: #4fc3cd; --bad: #ff7b72; --warn: #e3b341;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
    main { padding: 16px; display: grid; gap: 14px; grid-template-columns: 320px 1fr; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .mono { font: 12px ui-monospace, monospace; }
    #qr { width: 100%; aspect-ratio: 1; background: #fff; border-radius: 8px; display: block; }
    #url { width: 100%; margin-top: 8px; font: 13px ui-monospace, monospace; padding: 6px 8px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    .totals { display: flex; gap: 18px; margin-top: 12px; }
    .totals b { font-size: 22px; display: block; }
    .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .block { border-radius: 10px; padding: 10px; border: 1px solid; min-height: 120px; }
    .block[data-b="0"] { background: var(--b1); border-color: var(--b1s); }
    .block[data-b="1"] { background: var(--b2); border-color: var(--b2s); }
    .block[data-b="2"] { background: var(--b3); border-color: var(--b3s); }
    .block .name { font-weight: 600; }
    .block .warn { color: var(--bad); font-size: 13px; }
    .phone { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-top: 6px; }
    .phone.loading { opacity: .55; }
    .phone .top { display: flex; justify-content: space-between; font-weight: 600; }
    .phone .flag { font-size: 12px; font-weight: 400; }
    .phone .flag.bad { color: var(--bad); }
    .phone .flag.warn { color: var(--warn); }
    .right { display: grid; gap: 14px; }
    #sessions, #events { white-space: pre-wrap; margin: 0; }
    #events { max-height: 260px; overflow-y: auto; }
    #conn { font-size: 12px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } .blocks { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Phone Swarm</h1>
    <div class="muted">Scan to join. Every phone serves one block and can ask.</div>
    <img id="qr" alt="QR code of the address phones open">
    <input id="url" spellcheck="false" title="The address phones open. Edit it to change the QR code.">
    <div class="totals">
      <div><b id="nPhones">0</b><span class="muted">phones</span></div>
      <div><b id="nSessions">0</b><span class="muted">answering</span></div>
      <div><b id="nServed">0</b><span class="muted">tokens served</span></div>
    </div>
    <div id="conn" class="muted"></div>
    <a href="manage.html" style="font-size:12px;color:var(--accent)">Throughput and utilization →</a>
  </section>

  <div class="right">
    <section class="card">
      <h2>Blocks</h2>
      <div class="blocks" id="blocks"></div>
    </section>
    <section class="card">
      <h2>Questions in flight</h2>
      <pre id="sessions" class="mono muted"></pre>
    </section>
    <section class="card">
      <h2>Tracker log</h2>
      <pre id="events" class="mono muted"></pre>
    </section>
  </div>
</main>
<script type="module" src="dashboard.js"></script>
</body>
</html>
